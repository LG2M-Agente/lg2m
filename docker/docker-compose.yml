version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lg2m_postgres_vector
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lg2m_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lg2m_password}
      POSTGRES_DB: ${POSTGRES_DB:-lg2m_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lg2m_user -d lg2m_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
